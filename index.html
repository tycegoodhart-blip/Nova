<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nova Messaging App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full w-full overflow-hidden select-none">

  <div id="app" class="h-full w-full flex flex-col font-sans transition-colors duration-300 overflow-hidden">
    <!-- Main content rendered via JavaScript -->
  </div>

  <script>
    // --- Application Constants & Profiles ---
    const PROFILES = {
      user1: {
        id: 'user1',
        name: 'Tyce',
        handle: '@tyce',
        avatar: '🚙',
        status: 'Online',
        color: 'bg-gradient-to-r from-fuchsia-600 to-pink-500',
        textColor: 'text-fuchsia-400'
      },
      user2: {
        id: 'user2',
        name: 'Arch',
        handle: '@arch',
        avatar: '✏️',
        status: 'Active now',
        color: 'bg-gradient-to-r from-cyan-500 to-teal-400',
        textColor: 'text-cyan-400'
      }
    };

    const REACTION_EMOJIS = ['🩷', '👍', '👎', '😆', '❗️', '❔'];

    // --- State Management ---
    let state = {
      currentUserId: 'user1',
      activeChatUserId: 'user2',
      isDarkMode: true,
      soundEnabled: true,
      searchQuery: '',
      showMobileSidebar: true,
      showSettings: false,
      showImageInput: false,
      selectedPickerMsgId: null,
      messages: [],
      roomId: localStorage.getItem('nova_room_id') || 'nova-shared-room',
      customConfig: localStorage.getItem('nova_custom_firebase') || '',
      isCloudConnected: false
    };

    let audioCtxInstance = null;
    let broadcastChannel = null;

    // --- Utility Helpers ---
    function isSingleEmoji(text) {
      if (!text) return false;
      const trimmed = text.trim();
      const emojiRegex = /^(\p{Extended_Pictographic}|\p{Emoji_Presentation})$/u;
      return emojiRegex.test(trimmed);
    }

    function playNotificationSound() {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtxInstance) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtxInstance = new AudioCtx();
        }
        if (audioCtxInstance && audioCtxInstance.state === 'suspended') {
          audioCtxInstance.resume();
        }
        if (!audioCtxInstance) return;

        const osc = audioCtxInstance.createOscillator();
        const gain = audioCtxInstance.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtxInstance.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtxInstance.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtxInstance.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtxInstance.destination);
        osc.start();
        osc.stop(audioCtxInstance.currentTime + 0.15);
      } catch (e) {}
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            const max = 800;
            if (width > max || height > max) {
              if (width > height) {
                height = Math.round((height * max) / width);
                width = max;
              } else {
                width = Math.round((width * max) / height);
                height = max;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.onerror = () => resolve(e.target.result);
        };
        reader.onerror = () => resolve(null);
      });
    }

    function loadMessagesFromStorage() {
      try {
        const stored = localStorage.getItem(`nova_msgs_${state.roomId}`);
        if (stored) {
          state.messages = JSON.parse(stored);
        } else {
          state.messages = [];
        }
      } catch (e) {
        state.messages = [];
      }
    }

    function saveAndSyncMessages() {
      try {
        localStorage.setItem(`nova_msgs_${state.roomId}`, JSON.stringify(state.messages));
      } catch (e) {}

      if (broadcastChannel) {
        try {
          broadcastChannel.postMessage({ type: 'SYNC', msgs: state.messages });
        } catch (e) {}
      }
    }

    function setupBroadcastChannel() {
      if (broadcastChannel) {
        try { broadcastChannel.close(); } catch (e) {}
      }
      if ('BroadcastChannel' in window) {
        broadcastChannel = new BroadcastChannel(`nova_bc_${state.roomId}`);
        broadcastChannel.onmessage = (event) => {
          if (event.data && event.data.type === 'SYNC' && Array.isArray(event.data.msgs)) {
            const prevCount = state.messages.length;
            state.messages = event.data.msgs;
            if (state.messages.length > prevCount) {
              const newest = state.messages[state.messages.length - 1];
              if (newest.senderId !== state.currentUserId) {
                playNotificationSound();
              }
            }
            render();
          }
        };
      }
    }

    // --- Message Actions ---
    function sendMessage(text, mediaUrl = null) {
      if (!text.trim() && !mediaUrl) return;

      const msg = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        senderId: state.currentUserId,
        receiverId: state.activeChatUserId,
        text: text.trim(),
        mediaUrl: mediaUrl || null,
        timestamp: Date.now(),
        reactions: {}
      };

      state.messages.push(msg);
      saveAndSyncMessages();
      render();
      scrollToBottom();
    }

    function deleteMessage(msgId) {
      state.messages = state.messages.filter(m => m.id !== msgId);
      state.selectedPickerMsgId = null;
      saveAndSyncMessages();
      render();
    }

    function toggleReaction(msgId, emoji) {
      const msg = state.messages.find(m => m.id === msgId);
      if (!msg) return;

      if (!msg.reactions) msg.reactions = {};
      const currentUsers = msg.reactions[emoji] || [];

      if (currentUsers.includes(state.currentUserId)) {
        msg.reactions[emoji] = currentUsers.filter(u => u !== state.currentUserId);
        if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
      } else {
        msg.reactions[emoji] = [...currentUsers, state.currentUserId];
      }

      state.selectedPickerMsgId = null;
      saveAndSyncMessages();
      render();
    }

    function scrollToBottom() {
      setTimeout(() => {
        const feed = document.getElementById('message-feed');
        if (feed) feed.scrollTop = feed.scrollHeight;
      }, 50);
    }

    function render() {
      const app = document.getElementById('app');
      const currentUser = PROFILES[state.currentUserId];
      const activePartner = PROFILES[state.activeChatUserId];

      const activeMsgs = state.messages.filter(
        m => (m.senderId === state.currentUserId && m.receiverId === state.activeChatUserId) ||
             (m.senderId === state.activeChatUserId && m.receiverId === state.currentUserId)
      );

      const filteredContacts = Object.values(PROFILES).filter(p => 
        p.id !== state.currentUserId && p.name.toLowerCase().includes(state.searchQuery.toLowerCase())
      );

      const themeBg = state.isDarkMode ? 'bg-slate-950 text-cyan-50' : 'bg-slate-100 text-slate-900';
      const headerBg = state.isDarkMode ? 'bg-slate-900/90 border-cyan-950 text-slate-300' : 'bg-white/90 border-slate-200 text-slate-600';
      const containerBg = state.isDarkMode ? 'bg-slate-900/80 border-cyan-900/30 shadow-cyan-950/40' : 'bg-white border-slate-200 shadow-slate-300/50';
      const sidebarBg = state.isDarkMode ? 'bg-slate-950/60 border-cyan-950' : 'bg-slate-50 border-slate-200';

      app.className = `h-full w-full flex flex-col font-sans transition-colors duration-300 overflow-hidden ${themeBg}`;

      app.innerHTML = `
        <!-- Top Header -->
        <header class="border-b px-3 sm:px-4 py-2.5 flex items-center justify-between text-xs backdrop-blur-md z-30 shrink-0 pt-safe ${headerBg}">
          <div class="flex items-center space-x-2">
            <span class="font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-pink-400 text-xl leading-none px-1">
              NOVA
            </span>
            <button onclick="openSettings()" class="hidden sm:flex items-center text-amber-400 hover:text-amber-300 font-medium bg-amber-950/80 border border-amber-800/80 px-2 py-0.5 rounded-full transition-colors cursor-pointer text-[10px]">
              ⚡ Room: ${state.roomId}
            </button>
          </div>

          <div class="flex items-center space-x-1.5 sm:space-x-2">
            <!-- Profile Switcher -->
            <div class="flex items-center space-x-1 bg-slate-800/60 p-1 rounded-xl border border-cyan-900/30">
              ${Object.values(PROFILES).map(p => {
                const isSelf = p.id === state.currentUserId;
                const activeBadge = p.id === 'user1'
                  ? 'bg-gradient-to-r from-fuchsia-600 to-pink-500 text-white font-bold shadow-md shadow-pink-500/20'
                  : 'bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950 font-bold shadow-md shadow-cyan-500/20';
                return `
                  <button onclick="switchUser('${p.id}')" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg text-xs transition-all active:scale-95 ${isSelf ? activeBadge : 'text-slate-400 hover:text-slate-200'}">
                    <span class="text-sm">${p.avatar}</span>
                    <span class="font-semibold text-xs">${p.name}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <button onclick="toggleSound()" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 active:scale-95" title="Toggle Sound">
              ${state.soundEnabled ? '🔈' : '🔇'}
            </button>
            <button onclick="openSettings()" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 active:scale-95" title="Settings">
              ⚙️
            </button>
            <button onclick="toggleTheme()" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 active:scale-95" title="Toggle Theme">
              ${state.isDarkMode ? '🌙' : '☀️'}
            </button>
          </div>
        </header>

        <!-- Main Body -->
        <div class="flex-1 w-full max-w-6xl mx-auto p-0 sm:p-3 md:p-4 flex overflow-hidden">
          <div class="w-full h-full sm:rounded-3xl border flex overflow-hidden shadow-2xl transition-all ${containerBg}">

            <!-- Sidebar -->
            <div class="w-full sm:w-80 md:w-88 border-r flex flex-col shrink-0 ${state.showMobileSidebar ? 'flex' : 'hidden sm:flex'} ${sidebarBg}">
              <div class="p-3.5 border-b border-cyan-950/30 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <span class="text-2xl">${currentUser.avatar}</span>
                  <div>
                    <h2 class="font-bold text-sm leading-tight">${currentUser.name}</h2>
                    <p class="text-[11px] font-medium ${currentUser.textColor}">Active Profile</p>
                  </div>
                </div>
              </div>

              <div class="p-2.5">
                <input
                  type="text"
                  placeholder="Search contacts..."
                  value="${state.searchQuery}"
                  oninput="updateSearch(this.value)"
                  class="w-full px-3 py-2 rounded-xl text-xs border focus:outline-none ${state.isDarkMode ? 'bg-slate-900 border-cyan-900/30 text-cyan-100' : 'bg-white border-slate-200'}"
                />
              </div>

              <div class="flex-1 overflow-y-auto px-2 space-y-1 smooth-scroll">
                ${filteredContacts.map(contact => {
                  const isSelected = contact.id === state.activeChatUserId;
                  const lastMsg = state.messages
                    .filter(m => (m.senderId === state.currentUserId && m.receiverId === contact.id) || (m.senderId === contact.id && m.receiverId === state.currentUserId))
                    .pop();
                  const contactHighlight = contact.id === 'user1'
                    ? 'bg-gradient-to-r from-fuchsia-500/20 to-pink-500/10 border-fuchsia-500/40 text-fuchsia-100'
                    : 'bg-gradient-to-r from-cyan-500/20 to-teal-500/10 border-cyan-500/40 text-cyan-100';

                  return `
                    <button onclick="selectContact('${contact.id}')" class="w-full p-3 rounded-2xl flex items-center space-x-3 text-left border transition-all active:scale-98 ${isSelected ? contactHighlight : state.isDarkMode ? 'border-transparent hover:bg-slate-900/60 text-slate-300' : 'border-transparent hover:bg-slate-200/60 text-slate-800'}">
                      <div class="w-11 h-11 rounded-2xl ${contact.color} flex items-center justify-center text-xl shadow-md shrink-0">
                        ${contact.avatar}
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                          <span class="font-semibold text-xs truncate">${contact.name}</span>
                        </div>
                        <p class="text-xs text-slate-400 truncate">
                          ${lastMsg ? (lastMsg.mediaUrl ? '📷 Attachment' : lastMsg.text) : '<span class="italic text-cyan-400">Start thread</span>'}
                        </p>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Chat Area -->
            <div class="flex-1 flex flex-col h-full ${!state.showMobileSidebar ? 'flex' : 'hidden sm:flex'}">
              <!-- Chat Header -->
              <div class="px-4 py-3 border-b flex items-center justify-between shrink-0 ${state.isDarkMode ? 'bg-slate-950/40 border-cyan-950' : 'bg-slate-50 border-slate-200'}">
                <div class="flex items-center space-x-3">
                  <button onclick="showSidebar()" class="sm:hidden text-cyan-400 font-bold text-xs p-1">◀ Contacts</button>
                  <div class="w-9 h-9 rounded-xl ${activePartner.color} flex items-center justify-center text-lg shadow-sm">
                    ${activePartner.avatar}
                  </div>
                  <div>
                    <h2 class="font-bold text-sm leading-tight">${activePartner.name}</h2>
                    <p class="text-[11px] ${activePartner.textColor}">${activePartner.handle}</p>
                  </div>
                </div>
              </div>

              <!-- Messages Feed -->
              <div id="message-feed" class="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3 smooth-scroll ${state.isDarkMode ? 'bg-slate-950/20' : 'bg-slate-50/30'}">
                ${activeMsgs.length === 0 ? `
                  <div class="h-full flex flex-col items-center justify-center text-center p-6 space-y-2">
                    <div class="text-4xl mb-1">${activePartner.avatar}</div>
                    <h3 class="font-bold text-cyan-200 text-sm">Start Messaging ${activePartner.name}</h3>
                    <p class="text-xs text-slate-400 max-w-xs">Messages synchronize live across tabs and devices instantly.</p>
                  </div>
                ` : activeMsgs.map(msg => renderMessageBubble(msg)).join('')}
              </div>

              <!-- Input Composer -->
              <div class="p-2.5 sm:p-3 border-t shrink-0 pb-safe ${state.isDarkMode ? 'bg-slate-950/80 border-cyan-950' : 'bg-white border-slate-200'}">
                ${state.showImageInput ? `
                  <div class="p-2 mb-2 bg-slate-900 border border-cyan-900/40 rounded-2xl flex items-center space-x-2">
                    <input id="img-url-input" type="url" placeholder="Paste image URL..." class="flex-1 px-3 py-1.5 text-xs bg-slate-950 rounded-xl border border-slate-800 text-cyan-100 focus:outline-none" />
                    <button onclick="attachImageFromUrl()" class="px-3 py-1 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs">Attach</button>
                  </div>
                ` : ''}

                <form onsubmit="handleSendSubmit(event)" class="flex items-center space-x-1.5 sm:space-x-2">
                  <label class="cursor-pointer p-2 rounded-xl text-slate-400 hover:text-cyan-300 text-lg transition-transform active:scale-95" title="Attach Image File">
                    📎
                    <input type="file" accept="image/*" onchange="handleFileUpload(event)" class="hidden" />
                  </label>

                  <button type="button" onclick="toggleImageInput()" class="p-2 rounded-xl text-slate-400 hover:text-cyan-300 text-base transition-transform active:scale-95" title="Attach Image Link">
                    🌐
                  </button>

                  <input
                    id="message-input"
                    type="text"
                    placeholder="Message to ${activePartner.name}..."
                    class="flex-1 px-4 py-2.5 rounded-full text-xs sm:text-sm focus:outline-none transition-all ${state.isDarkMode ? 'bg-slate-900 border border-slate-800 text-cyan-50 placeholder-slate-500 focus:border-cyan-500/60' : 'bg-slate-100 border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-cyan-500'}"
                  />

                  <button type="submit" class="px-4 py-2.5 rounded-full text-xs font-bold transition-all ${state.currentUserId === 'user1' ? 'bg-gradient-to-r from-fuchsia-600 to-pink-500 text-white shadow-md shadow-pink-500/20 active:scale-95' : 'bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950 shadow-md shadow-cyan-500/20 active:scale-95'}">
                    Send
                  </button>
                </form>
              </div>
            </div>

          </div>
        </div>

        <!-- Settings Modal -->
        ${state.showSettings ? renderSettingsModal() : ''}
      `;
    }

    function renderMessageBubble(msg) {
      const isMe = msg.senderId === state.currentUserId;
      const singleEmoji = isSingleEmoji(msg.text) && !msg.mediaUrl;
      const formattedTime = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const myGradient = msg.senderId === 'user1'
        ? 'bg-gradient-to-r from-fuchsia-600 to-pink-500 text-white'
        : 'bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950';

      const showPicker = state.selectedPickerMsgId === msg.id;
      const reactions = msg.reactions || {};

      return `
        <div class="group relative flex flex-col my-1 ${isMe ? 'items-end' : 'items-start'}">
          ${showPicker ? `
            <div class="absolute -top-9 ${isMe ? 'right-2' : 'left-2'} bg-slate-900/95 border border-cyan-900/60 backdrop-blur-md rounded-full px-2.5 py-1 flex items-center space-x-1.5 shadow-xl z-20">
              ${REACTION_EMOJIS.map(emoji => {
                const hasReacted = (reactions[emoji] || []).includes(state.currentUserId);
                return `
                  <button onclick="toggleReaction('${msg.id}', '${emoji}')" class="text-sm p-1 rounded-full transition-transform active:scale-125 ${hasReacted ? 'bg-cyan-950/80 ring-1 ring-cyan-400' : 'hover:bg-slate-800/80'}">
                    ${emoji}
                  </button>
                `;
              }).join('')}
              ${isMe ? `
                <div class="w-px h-3 bg-slate-700/60 mx-1"></div>
                <button onclick="deleteMessage('${msg.id}')" class="text-slate-400 hover:text-red-400 text-xs p-1" title="Delete message">🗑️</button>
              ` : ''}
            </div>
          ` : ''}

          ${singleEmoji ? `
            <div onclick="togglePicker('${msg.id}')" class="cursor-pointer transition-transform active:scale-110 text-5xl sm:text-6xl p-1 select-none my-0.5">
              ${msg.text}
            </div>
          ` : `
            <div onclick="togglePicker('${msg.id}')" class="cursor-pointer transition-all max-w-[85%] sm:max-w-[75%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm shadow-sm ${isMe ? `${myGradient} font-medium` : state.isDarkMode ? 'bg-slate-800 text-cyan-50' : 'bg-slate-200 text-slate-900'}">
              ${msg.mediaUrl ? `
                <div class="mb-2 overflow-hidden rounded-xl border border-black/10 max-w-xs">
                  <img src="${msg.mediaUrl}" alt="Attachment" class="max-h-56 w-full object-cover rounded-lg" onerror="this.style.display='none'" />
                </div>
              ` : ''}
              ${msg.text ? `<p class="leading-relaxed break-words">${msg.text}</p>` : ''}
              <div class="mt-1 text-[9px] text-right ${isMe ? (msg.senderId === 'user1' ? 'text-white/80' : 'text-slate-900/70') : 'text-slate-400'}">
                ${formattedTime}
              </div>
            </div>
          `}

          ${Object.keys(reactions).length > 0 ? `
            <div class="flex flex-wrap gap-1 mt-1 ${isMe ? 'justify-end' : 'justify-start'}">
              ${Object.entries(reactions).map(([emoji, users]) => {
                if (!users || users.length === 0) return '';
                const hasIReacted = users.includes(state.currentUserId);
                const colorUserId = hasIReacted ? state.currentUserId : users[0];
                const userProfile = PROFILES[colorUserId];
                const badgeColor = userProfile ? userProfile.color : 'bg-slate-800';
                const textStyle = colorUserId === 'user1' ? 'text-white' : 'text-slate-950';
                return `
                  <button onclick="toggleReaction('${msg.id}', '${emoji}')" class="flex items-center space-x-1 text-[10px] px-2 py-0.5 rounded-full border border-black/10 font-bold shadow-sm ${badgeColor} ${textStyle}">
                    <span>${emoji}</span>
                    <span class="text-[9px] font-mono">${users.length}</span>
                  </button>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSettingsModal() {
      return `
        <div class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="w-full max-w-md rounded-3xl p-5 sm:p-6 border shadow-2xl ${state.isDarkMode ? 'bg-slate-900 border-cyan-900/50 text-cyan-50' : 'bg-white border-slate-300 text-slate-900'}">
            <h3 class="font-extrabold text-base mb-2">Sync & Room Settings</h3>
            <p class="text-xs text-slate-400 mb-4">
              Enter the same <strong>Room Sync Code</strong> on both windows or devices to pair your live conversation.
            </p>

            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-300 mb-1">Room Sync Code</label>
              <input id="settings-room-input" type="text" value="${state.roomId}" class="w-full px-3 py-2 text-xs rounded-xl bg-slate-950 border border-cyan-900/40 text-cyan-300 font-mono focus:outline-none" />
            </div>

            <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-800">
              <button onclick="closeSettings()" class="px-4 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
              <button onclick="saveSettings()" class="px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-fuchsia-600 to-pink-500 text-white shadow-md">
                Save & Connect
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- User Actions & Event Handlers ---
    function switchUser(userId) {
      state.currentUserId = userId;
      if (userId === state.activeChatUserId) {
        state.activeChatUserId = Object.keys(PROFILES).find(id => id !== userId);
      }
      render();
    }

    function selectContact(contactId) {
      state.activeChatUserId = contactId;
      state.showMobileSidebar = false;
      render();
      scrollToBottom();
    }

    function showSidebar() {
      state.showMobileSidebar = true;
      render();
    }

    function toggleTheme() {
      state.isDarkMode = !state.isDarkMode;
      render();
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      render();
    }

    function updateSearch(query) {
      state.searchQuery = query;
      render();
    }

    function togglePicker(msgId) {
      state.selectedPickerMsgId = state.selectedPickerMsgId === msgId ? null : msgId;
      render();
    }

    function toggleImageInput() {
      state.showImageInput = !state.showImageInput;
      render();
    }

    function attachImageFromUrl() {
      const input = document.getElementById('img-url-input');
      if (input && input.value.trim()) {
        sendMessage('', input.value.trim());
        state.showImageInput = false;
      }
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const compressed = await compressImage(file);
        if (compressed) {
          sendMessage('', compressed);
        }
      }
      e.target.value = '';
    }

    function handleSendSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      if (input && input.value.trim()) {
        sendMessage(input.value);
        input.value = '';
      }
    }

    function openSettings() {
      state.showSettings = true;
      render();
    }

    function closeSettings() {
      state.showSettings = false;
      render();
    }

    function saveSettings() {
      const roomInput = document.getElementById('settings-room-input');
      if (roomInput && roomInput.value.trim()) {
        state.roomId = roomInput.value.trim();
        localStorage.setItem('nova_room_id', state.roomId);
        loadMessagesFromStorage();
        setupBroadcastChannel();
      }
      state.showSettings = false;
      render();
    }

    // --- App Lifecycle Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      loadMessagesFromStorage();
      setupBroadcastChannel();
      render();
    });
  </script>
</body>
</html>
