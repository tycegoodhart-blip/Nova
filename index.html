<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Messaging App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.5); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp, getApps, getApp,
      getAuth, signInWithCustomToken, signInAnonymously,
      getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot
    };
  </script>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PROFILES = {
      user1: {
        id: 'user1',
        name: 'Tyce',
        handle: '@tyce',
        avatar: '🚙',
        status: 'Online',
        color: 'bg-gradient-to-r from-fuchsia-500 to-pink-500',
        badgeColor: 'from-fuchsia-500 to-pink-500',
        textColor: 'text-fuchsia-400'
      },
      user2: {
        id: 'user2',
        name: 'Arch',
        handle: '@arch',
        avatar: '✏️',
        status: 'Active now',
        color: 'bg-gradient-to-r from-cyan-500 to-teal-400',
        badgeColor: 'from-cyan-500 to-teal-400',
        textColor: 'text-cyan-400'
      }
    };

    const PRESET_EMOJIS = ['🧊', '⚡', '🏔️', '💙', '✨', '🔥', '👍', '😂', '🌊', '🎯', '🚀', '☕'];

    const getLocalStorageKey = (room) => `nova_messages_${room}`;

    const loadLocalMessages = (room) => {
      try {
        const stored = localStorage.getItem(getLocalStorageKey(room));
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    };

    const saveLocalMessages = (room, msgs) => {
      try {
        localStorage.setItem(getLocalStorageKey(room), JSON.stringify(msgs));
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel(`nova_channel_${room}`);
          bc.postMessage({ type: 'SYNC_MESSAGES', msgs });
          bc.close();
        }
      } catch (e) {}
    };

    function App() {
      const [profiles] = useState(PROFILES);
      const [currentUserId, setCurrentUserId] = useState('user1');
      const [activeChatUserId, setActiveChatUserId] = useState('user2');

      const [messages, setMessages] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [hasPermissionError, setHasPermissionError] = useState(false);
      const [dbInstance, setDbInstance] = useState(null);

      const [roomId, setRoomId] = useState(() => localStorage.getItem('nova_room_id') || 'nova-shared-room');
      const [customFirebaseConfig, setCustomFirebaseConfig] = useState(() => localStorage.getItem('nova_custom_firebase') || '');
      const [showSettings, setShowSettings] = useState(false);

      const [isDarkMode, setIsDarkMode] = useState(true);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [searchContact, setSearchContact] = useState('');
      const [showMobileSidebar, setShowMobileSidebar] = useState(true);

      const currentUser = profiles[currentUserId];
      const activePartner = profiles[activeChatUserId];
      const lastMessageCount = useRef(0);

      useEffect(() => {
        let unsubscribe = () => {};
        let bc = null;

        if ('BroadcastChannel' in window) {
          bc = new BroadcastChannel(`nova_channel_${roomId}`);
          bc.onmessage = (event) => {
            if (event.data && event.data.type === 'SYNC_MESSAGES' && !isCloudConnected) {
              setMessages(event.data.msgs || []);
            }
          };
        }

        const setupFirebaseSync = async () => {
          setIsLoading(true);
          setHasPermissionError(false);

          try {
            let firebaseConfig = null;

            if (customFirebaseConfig.trim()) {
              try { firebaseConfig = JSON.parse(customFirebaseConfig); } catch (e) {}
            }

            if (!firebaseConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
              firebaseConfig = JSON.parse(__firebase_config);
            }

            if (firebaseConfig && window.FirebaseSDK) {
              const { initializeApp, getApps, getApp, getAuth, signInWithCustomToken, signInAnonymously, initializeFirestore, getFirestore, collection, onSnapshot } = window.FirebaseSDK;
              
              const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
              const auth = getAuth(app);
              
              // Force long-polling to prevent WebSocket connection drops in sandboxed previews
              let db;
              try {
                db = initializeFirestore(app, {
                  experimentalForceLongPolling: true,
                });
              } catch (e) {
                db = getFirestore(app);
              }

              let user = null;
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && !customFirebaseConfig) {
                  const cred = await signInWithCustomToken(auth, __initial_auth_token);
                  user = cred.user;
                } else {
                  const cred = await signInAnonymously(auth);
                  user = cred.user;
                }
              } catch (authErr) {}

              setDbInstance(db);

              const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-app';
              const activeRoom = roomId.trim() || 'nova-shared-room';
              
              // Firestore path for persistent multi-device public chat
              const msgsRef = collection(db, 'artifacts', appId, 'public', 'data', activeRoom);

              unsubscribe = onSnapshot(
                msgsRef,
                (snapshot) => {
                  const loadedMsgs = [];
                  snapshot.forEach((docSnap) => {
                    loadedMsgs.push({ id: docSnap.id, ...docSnap.data() });
                  });
                  
                  loadedMsgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                  
                  if (loadedMsgs.length > lastMessageCount.current && lastMessageCount.current > 0) {
                    const newest = loadedMsgs[loadedMsgs.length - 1];
                    if (newest.senderId !== currentUserId && soundEnabled) {
                      playNotificationSound();
                    }
                  }
                  lastMessageCount.current = loadedMsgs.length;

                  setMessages(loadedMsgs);
                  saveLocalMessages(activeRoom, loadedMsgs);
                  setIsCloudConnected(true);
                  setHasPermissionError(false);
                  setIsLoading(false);
                },
                (error) => {
                  // Gracefully fall back to local tab sync mode if Firestore backend is unreachable
                  console.warn("Firestore unavailable, running in local fallback mode:", error.message);
                  setIsCloudConnected(false);
                  setDbInstance(null);
                  setHasPermissionError(true);
                  setIsLoading(false);
                  setMessages(loadLocalMessages(activeRoom));
                }
              );
            } else {
              setIsCloudConnected(false);
              setDbInstance(null);
              setIsLoading(false);
              setMessages(loadLocalMessages(roomId));
            }
          } catch (err) {
            setIsCloudConnected(false);
            setDbInstance(null);
            setHasPermissionError(true);
            setIsLoading(false);
            setMessages(loadLocalMessages(roomId));
          }
        };

        setupFirebaseSync();

        return () => {
          unsubscribe();
          if (bc) bc.close();
        };
      }, [roomId, customFirebaseConfig, soundEnabled, currentUserId]);

      const playNotificationSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
      };

      const handleSwitchUser = (newUserId) => {
        setCurrentUserId(newUserId);
        if (newUserId === activeChatUserId) {
          const otherUser = Object.keys(profiles).find(id => id !== newUserId);
          setActiveChatUserId(otherUser);
        }
      };

      const handleSendMessage = async (text, mediaUrl = null) => {
        if (!text.trim() && !mediaUrl) return;

        const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const newMsg = {
          id: msgId,
          senderId: currentUserId,
          receiverId: activeChatUserId,
          text: text.trim(),
          mediaUrl: mediaUrl || null,
          timestamp: Date.now(),
          reactions: {}
        };

        const updatedMsgs = [...messages, newMsg];
        setMessages(updatedMsgs);
        saveLocalMessages(roomId, updatedMsgs);

        if (dbInstance && isCloudConnected) {
          try {
            const { doc, setDoc } = window.FirebaseSDK;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-app';
            const activeRoom = roomId.trim() || 'nova-shared-room';
            const msgDocRef = doc(dbInstance, 'artifacts', appId, 'public', 'data', activeRoom, msgId);
            await setDoc(msgDocRef, newMsg);
          } catch (err) {
            setHasPermissionError(true);
            setIsCloudConnected(false);
            setDbInstance(null);
          }
        }
      };

      const handleDeleteMessage = async (msgId) => {
        const updatedMsgs = messages.filter(m => m.id !== msgId);
        setMessages(updatedMsgs);
        saveLocalMessages(roomId, updatedMsgs);

        if (dbInstance && isCloudConnected) {
          try {
            const { doc, deleteDoc } = window.FirebaseSDK;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-app';
            const activeRoom = roomId.trim() || 'nova-shared-room';
            const msgDocRef = doc(dbInstance, 'artifacts', appId, 'public', 'data', activeRoom, msgId);
            await deleteDoc(msgDocRef);
          } catch (err) {}
        }
      };

      const handleAddReaction = async (msgId, emoji) => {
        const targetMsg = messages.find(m => m.id === msgId);
        if (!targetMsg) return;

        const reactions = { ...(targetMsg.reactions || {}) };
        const currentUsers = reactions[emoji] || [];
        
        if (currentUsers.includes(currentUserId)) {
          reactions[emoji] = currentUsers.filter(u => u !== currentUserId);
          if (reactions[emoji].length === 0) delete reactions[emoji];
        } else {
          reactions[emoji] = [...currentUsers, currentUserId];
        }

        const updatedMsgs = messages.map(m => m.id === msgId ? { ...m, reactions } : m);
        setMessages(updatedMsgs);
        saveLocalMessages(roomId, updatedMsgs);

        if (dbInstance && isCloudConnected) {
          try {
            const { doc, updateDoc } = window.FirebaseSDK;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-app';
            const activeRoom = roomId.trim() || 'nova-shared-room';
            const msgDocRef = doc(dbInstance, 'artifacts', appId, 'public', 'data', activeRoom, msgId);
            await updateDoc(msgDocRef, { reactions });
          } catch (err) {}
        }
      };

      const saveSettings = (newRoomId, newConfig) => {
        setRoomId(newRoomId);
        setCustomFirebaseConfig(newConfig);
        localStorage.setItem('nova_room_id', newRoomId);
        localStorage.setItem('nova_custom_firebase', newConfig);
        setShowSettings(false);
      };

      const contactsList = Object.values(profiles).filter(p => p.id !== currentUserId && 
        p.name.toLowerCase().includes(searchContact.toLowerCase())
      );

      const activeConversation = messages.filter(
        m => (m.senderId === currentUserId && m.receiverId === activeChatUserId) ||
             (m.senderId === activeChatUserId && m.receiverId === currentUserId)
      );

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-colors duration-300 ${
          isDarkMode ? 'bg-slate-950 text-cyan-50' : 'bg-slate-100 text-slate-900'
        }`}>
          
          {}
          {/* Header Bar */}
          <header className={`border-b px-4 py-2.5 flex items-center justify-between text-xs backdrop-blur-md z-30 ${
            isDarkMode ? 'bg-slate-900/90 border-cyan-950 text-slate-300' : 'bg-white/90 border-slate-200 text-slate-600'
          }`}>
            <div className="flex items-center space-x-2">
              <span className="font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-pink-400 text-lg leading-none px-1">
                NOVA
              </span>
              
              <div className="hidden md:flex items-center space-x-1 pl-3 border-l border-slate-800 text-[10px]">
                {isCloudConnected ? (
                  <span className="flex items-center text-emerald-400 font-medium bg-emerald-950/60 border border-emerald-800/60 px-2 py-0.5 rounded-full shadow-sm">
                    ☁️ Multi-Device Sync Active
                  </span>
                ) : hasPermissionError ? (
                  <button 
                    onClick={() => setShowSettings(true)}
                    className="flex items-center text-amber-400 hover:text-amber-300 font-medium bg-amber-950/80 border border-amber-800/80 px-2 py-0.5 rounded-full transition-colors cursor-pointer"
                  >
                    ⚠️ Local Mode (Permission Denied)
                  </button>
                ) : (
                  <span className="flex items-center text-amber-400 font-medium bg-amber-950/60 border border-amber-800/60 px-2 py-0.5 rounded-full">
                    ⚡ Local Tab Sync Mode
                  </span>
                )}
              </div>
            </div>

            {/* Profile Switcher */}
            <div className="flex items-center space-x-2">
              <div className="flex items-center space-x-1 bg-slate-800/50 p-1 rounded-xl border border-cyan-900/30">
                {Object.values(profiles).map((p) => {
                  const isSelf = p.id === currentUserId;
                  const activeBadge = p.id === 'user1'
                    ? 'bg-gradient-to-r from-fuchsia-500 to-pink-500 text-slate-950 font-bold shadow-md shadow-pink-500/20'
                    : 'bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950 font-bold shadow-md shadow-cyan-500/20';

                  return (
                    <button
                      key={p.id}
                      onClick={() => handleSwitchUser(p.id)}
                      className={`flex items-center space-x-1.5 px-3 py-1 rounded-lg text-xs transition-all ${
                        isSelf ? activeBadge : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <span className="text-sm">{p.avatar}</span>
                      <span className="font-semibold">{p.name}</span>
                    </button>
                  );
                })}
              </div>

              <button onClick={() => setSoundEnabled(!soundEnabled)} className="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300">
                {soundEnabled ? '🔈' : '🔇'}
              </button>

              <button onClick={() => setShowSettings(true)} className="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300">
                ⚙️
              </button>

              <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300">
                {isDarkMode ? '🌙' : '☀️'}
              </button>
            </div>
          </header>

          {/* Main Container */}
          <div className="flex-1 max-w-6xl w-full mx-auto p-2 sm:p-4 md:p-6 flex justify-center items-center">
            
            <div className={`w-full h-[700px] rounded-3xl border flex overflow-hidden shadow-2xl transition-all ${
              isDarkMode ? 'bg-slate-900/80 border-cyan-900/30 shadow-cyan-950/40' : 'bg-white border-slate-200 shadow-slate-300/50'
            }`}>

              {/* Sidebar */}
              <div className={`w-full sm:w-80 md:w-90 border-r flex flex-col shrink-0 ${
                showMobileSidebar ? 'flex' : 'hidden sm:flex'
              } ${isDarkMode ? 'bg-slate-950/60 border-cyan-950' : 'bg-slate-50 border-slate-200'}`}>
                
                <div className="p-4 border-b border-cyan-950/30 flex items-center justify-between">
                  <div className="flex items-center space-x-2.5">
                    <span className="text-2xl">{currentUser.avatar}</span>
                    <div>
                      <h2 className="font-bold text-sm leading-tight">{currentUser.name}</h2>
                      <p className={`text-[11px] font-medium ${currentUser.id === 'user1' ? 'text-fuchsia-400' : 'text-cyan-400'}`}>
                        Active on this device
                      </p>
                    </div>
                  </div>
                </div>

                <div className="p-3">
                  <input
                    type="text"
                    placeholder="Search contacts..."
                    value={searchContact}
                    onChange={(e) => setSearchContact(e.target.value)}
                    className={`w-full px-3 py-2 rounded-xl text-xs border focus:outline-none ${
                      isDarkMode ? 'bg-slate-900 border-cyan-900/30 text-cyan-100' : 'bg-white border-slate-200'
                    }`}
                  />
                </div>

                <div className="flex-1 overflow-y-auto px-2 space-y-1">
                  {contactsList.map((contact) => {
                    const isSelected = contact.id === activeChatUserId;
                    const lastMsg = messages
                      .filter(m => (m.senderId === currentUserId && m.receiverId === contact.id) || (m.senderId === contact.id && m.receiverId === currentUserId))
                      .pop();

                    const contactHighlight = contact.id === 'user1'
                      ? 'bg-gradient-to-r from-fuchsia-500/20 to-pink-500/10 border-fuchsia-500/40 text-fuchsia-100'
                      : 'bg-gradient-to-r from-cyan-500/20 to-teal-500/10 border-cyan-500/40 text-cyan-100';

                    return (
                      <button
                        key={contact.id}
                        onClick={() => {
                          setActiveChatUserId(contact.id);
                          setShowMobileSidebar(false);
                        }}
                        className={`w-full p-3 rounded-2xl flex items-center space-x-3 text-left border ${
                          isSelected
                            ? contactHighlight
                            : isDarkMode ? 'border-transparent hover:bg-slate-900/60 text-slate-300' : 'border-transparent hover:bg-slate-200/60 text-slate-800'
                        }`}
                      >
                        <div className={`w-11 h-11 rounded-2xl ${contact.color} flex items-center justify-center text-xl shadow-md shrink-0`}>
                          {contact.avatar}
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between mb-0.5">
                            <span className="font-semibold text-xs truncate">{contact.name}</span>
                          </div>
                          <p className="text-xs text-slate-400 truncate">
                            {lastMsg ? (lastMsg.mediaUrl ? '📷 Image' : lastMsg.text) : <span className="italic text-cyan-400">Start live thread</span>}
                          </p>
                        </div>
                      </button>
                    );
                  })}
                </div>

              </div>

              {/* Chat Thread */}
              <div className={`flex-1 flex flex-col h-full ${!showMobileSidebar ? 'flex' : 'hidden sm:flex'}`}>
                
                <div className={`px-4 py-3 border-b flex items-center justify-between ${
                  isDarkMode ? 'bg-slate-950/40 border-cyan-950' : 'bg-slate-50 border-slate-200'
                }`}>
                  <div className="flex items-center space-x-3">
                    <button onClick={() => setShowMobileSidebar(true)} className="sm:hidden text-slate-400">
                      ◀ Back
                    </button>
                    <div className={`w-9 h-9 rounded-xl ${activePartner.color} flex items-center justify-center text-lg`}>
                      {activePartner.avatar}
                    </div>
                    <div>
                      <h2 className="font-bold text-sm">{activePartner.name}</h2>
                      <p className={`text-[11px] ${activePartner.id === 'user1' ? 'text-fuchsia-400' : 'text-cyan-400'}`}>{activePartner.handle}</p>
                    </div>
                  </div>
                </div>

                <div className={`flex-1 p-4 overflow-y-auto space-y-3 ${isDarkMode ? 'bg-slate-950/20' : 'bg-slate-50/30'}`}>
                  {isLoading ? (
                    <div className="h-full flex items-center justify-center text-xs text-slate-400">Connecting to room...</div>
                  ) : activeConversation.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-center p-6 space-y-2">
                      <div className="text-4xl mb-2">{activePartner.avatar}</div>
                      <h3 className="font-bold text-cyan-200">Start Messaging {activePartner.name}</h3>
                      <p className="text-xs text-slate-400">Messages will sync live in room <strong className="text-cyan-300">{roomId}</strong>.</p>
                    </div>
                  ) : (
                    activeConversation.map((msg) => (
                      <MessageBubble
                        key={msg.id}
                        msg={msg}
                        isMe={msg.senderId === currentUserId}
                        senderId={msg.senderId}
                        currentUserId={currentUserId}
                        onDelete={() => handleDeleteMessage(msg.id)}
                        onReact={(emoji) => handleAddReaction(msg.id, emoji)}
                        isDarkMode={isDarkMode}
                      />
                    ))
                  )}
                </div>

                <ChatComposer onSend={handleSendMessage} partnerName={activePartner.name} currentUserId={currentUserId} isDarkMode={isDarkMode} />

              </div>

            </div>

          </div>

          {showSettings && (
            <BackendSettingsModal 
              roomId={roomId}
              customConfig={customFirebaseConfig}
              hasPermissionError={hasPermissionError}
              onSave={saveSettings}
              onClose={() => setShowSettings(false)}
              isDarkMode={isDarkMode}
            />
          )}

        </div>
      );
    }

    function ChatComposer({ onSend, partnerName, currentUserId, isDarkMode }) {
      const [inputText, setInputText] = useState('');
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [showImagePrompt, setShowImagePrompt] = useState(false);
      const [imageUrl, setImageUrl] = useState('');

      const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.7) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > height) {
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
              } else {
                if (height > maxHeight) {
                  width = Math.round((width * maxHeight) / height);
                  height = maxHeight;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => resolve(event.target.result);
          };
          reader.onerror = () => resolve(null);
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inputText.trim() && !imageUrl.trim()) return;
        onSend(inputText, imageUrl.trim() || null);
        setInputText('');
        setImageUrl('');
        setShowEmojiPicker(false);
        setShowImagePrompt(false);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          if (compressed) {
            onSend('', compressed);
          }
        }
        e.target.value = '';
      };

      return (
        <div className={`p-3 border-t relative ${
          isDarkMode ? 'bg-slate-950/80 border-cyan-950' : 'bg-white border-slate-200'
        }`}>
          {/* Quick Emoji Bar */}
          {showEmojiPicker && (
            <div className="p-2 mb-2 bg-slate-900 border border-cyan-900/40 rounded-2xl grid grid-cols-6 gap-2">
              {PRESET_EMOJIS.map(emoji => (
                <button
                  key={emoji}
                  type="button"
                  onClick={() => {
                    setInputText(prev => prev + emoji);
                    setShowEmojiPicker(false);
                  }}
                  className="p-1.5 hover:bg-cyan-950/60 rounded-xl text-lg transition-transform hover:scale-125 text-center"
                >
                  {emoji}
                </button>
              ))}
            </div>
          )}

          {/* Image URL Prompt */}
          {showImagePrompt && (
            <div className="p-2 mb-2 bg-slate-900 border border-cyan-900/40 rounded-2xl flex items-center space-x-2">
              <input
                type="url"
                placeholder="Paste image URL..."
                value={imageUrl}
                onChange={(e) => setImageUrl(e.target.value)}
                className="flex-1 px-3 py-1.5 text-xs bg-slate-950 rounded-xl border border-slate-800 text-cyan-100 focus:outline-none"
              />
              <button
                type="button"
                onClick={() => setShowImagePrompt(false)}
                className="px-3 py-1 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs"
              >
                Attach
              </button>
            </div>
          )}

          <form onSubmit={handleSubmit} className="flex items-center space-x-2">
            {/* Attachment File Input */}
            <label className="cursor-pointer p-2 rounded-xl text-slate-400 hover:text-cyan-300 hover:bg-slate-800/50 transition-colors" title="Attach file">
              📎
              <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
            </label>

            {/* Input Text Box */}
            <input
              type="text"
              value={inputText}
              onChange={(e) => setInputText(e.target.value)}
              placeholder={`Message to ${partnerName}...`}
              className={`flex-1 px-4 py-2 rounded-full text-xs sm:text-sm focus:outline-none transition-all ${
                isDarkMode 
                  ? 'bg-slate-900 border border-slate-800 text-cyan-50 placeholder-slate-500 focus:border-cyan-500/60' 
                  : 'bg-slate-100 border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-cyan-500'
              }`}
            />

            {/* Send Button */}
            <button
              type="submit"
              disabled={!inputText.trim() && !imageUrl.trim()}
              className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${
                inputText.trim() || imageUrl.trim()
                  ? 'bg-gradient-to-r from-fuchsia-500 to-pink-500 text-slate-950 shadow-md shadow-pink-500/20'
                  : 'bg-slate-800 text-slate-600 cursor-not-allowed'
              }`}
              title="Send message"
            >
              Send
            </button>
          </form>
        </div>
      );
    }

    function MessageBubble({ msg, isMe, senderId, currentUserId, onDelete, onReact, isDarkMode }) {
      const [showPicker, setShowPicker] = useState(false);
      const REACTION_EMOJIS = ['🩷', '👍', '👎', '😆', '❗️', '❔'];
      const formattedTime = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const myBubbleGradient = senderId === 'user1'
        ? 'bg-gradient-to-r from-fuchsia-500 to-pink-500 text-slate-950'
        : 'bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950';

      const reactions = msg.reactions || {};

      // Detect if message is a single emoji
      const isSingleEmoji = (str) => {
        if (!str) return false;
        const trimmed = str.trim();
        try {
          const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
          const segments = Array.from(segmenter.segment(trimmed));
          if (segments.length !== 1) return false;
          return /\p{Extended_Pictographic}/u.test(trimmed);
        } catch (e) {
          return /^[\p{Extended_Pictographic}\u{1F300}-\u{1F9FF}]$/u.test(trimmed);
        }
      };

      const singleEmoji = !msg.mediaUrl && isSingleEmoji(msg.text);

      return (
        <div 
          className={`group relative flex flex-col my-1 ${isMe ? 'items-end' : 'items-start'}`}
          onMouseEnter={() => setShowPicker(true)}
          onMouseLeave={() => setShowPicker(false)}
        >
          {/* Reaction Bar on Hover / Touch */}
          {showPicker && (
            <div className={`absolute -top-9 ${isMe ? 'right-2' : 'left-2'} bg-slate-900/95 border border-cyan-900/60 backdrop-blur-md rounded-full px-2.5 py-1 flex items-center space-x-1.5 shadow-xl z-20 animate-fade-in`}>
              {REACTION_EMOJIS.map((emoji) => {
                const hasReacted = (reactions[emoji] || []).includes(currentUserId);
                return (
                  <button
                    key={emoji}
                    type="button"
                    onClick={(e) => {
                      e.stopPropagation();
                      onReact(emoji);
                    }}
                    className={`text-sm p-1 rounded-full transition-transform hover:scale-125 active:scale-95 ${
                      hasReacted ? 'bg-cyan-950/80 ring-1 ring-cyan-400' : 'hover:bg-slate-800/80'
                    }`}
                    title={`React with ${emoji}`}
                  >
                    {emoji}
                  </button>
                );
              })}
              {isMe && (
                <>
                  <div className="w-px h-3 bg-slate-700/60 mx-1" />
                  <button 
                    type="button"
                    onClick={(e) => {
                      e.stopPropagation();
                      onDelete();
                    }} 
                    className="text-slate-400 hover:text-red-400 text-xs p-1" 
                    title="Delete message"
                  >
                    🗑️
                  </button>
                </>
              )}
            </div>
          )}

          {/* Message Text Bubble */}
          <div 
            onClick={() => setShowPicker(!showPicker)}
            className={`cursor-pointer transition-all ${
              singleEmoji
                ? 'p-1 text-5xl sm:text-6xl bg-transparent border-none shadow-none'
                : `max-w-[80%] px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-sm ${
                    isMe ? `${myBubbleGradient} font-medium` : isDarkMode ? 'bg-slate-800 text-cyan-50' : 'bg-slate-200 text-slate-900'
                  }`
            }`}
          >
            {msg.mediaUrl && (
              <div className="mb-2 overflow-hidden rounded-xl border border-black/10 max-w-xs">
                <img 
                  src={msg.mediaUrl} 
                  alt="Attachment" 
                  className="max-h-60 w-full object-cover rounded-lg"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
              </div>
            )}
            {msg.text && <p className={singleEmoji ? "leading-none select-none" : ""}>{msg.text}</p>}
            <div className={`mt-1 text-[9px] text-right ${
              singleEmoji
                ? (isDarkMode ? 'text-slate-400' : 'text-slate-500')
                : (isMe ? 'text-slate-900/70' : 'text-slate-400')
            }`}>
              {formattedTime}
            </div>
          </div>

          {/* Active Reactions List */}
          {Object.keys(reactions).length > 0 && (
            <div className={`flex flex-wrap gap-1 mt-1 ${isMe ? 'justify-end' : 'justify-start'}`}>
              {Object.entries(reactions).map(([emoji, users]) => {
                if (!users || users.length === 0) return null;
                const hasIReacted = users.includes(currentUserId);
                const colorUserId = hasIReacted ? currentUserId : users[0];
                const userProfile = PROFILES[colorUserId];
                const badgeColor = userProfile ? userProfile.color : 'bg-slate-800';

                return (
                  <button
                    key={emoji}
                    type="button"
                    onClick={() => onReact(emoji)}
                    className={`flex items-center space-x-1 text-[11px] px-2.5 py-0.5 rounded-full border border-black/10 transition-all text-slate-950 font-bold shadow-sm ${badgeColor}`}
                  >
                    <span>{emoji}</span>
                    <span className="text-[10px] font-mono">{users.length}</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function BackendSettingsModal({ roomId, customConfig, hasPermissionError, onSave, onClose, isDarkMode }) {
      const [localRoom, setLocalRoom] = useState(roomId);
      const [localConfig, setLocalConfig] = useState(customConfig);

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className={`w-full max-w-md rounded-3xl p-6 border shadow-2xl ${
            isDarkMode ? 'bg-slate-900 border-cyan-900/50 text-cyan-50' : 'bg-white border-slate-300 text-slate-900'
          }`}>
            <h3 className="font-extrabold text-base mb-3">Room & Sync Settings</h3>
            
            <div className="mb-4">
              <label className="block text-xs font-bold text-slate-300 mb-1">Room Sync ID</label>
              <input
                type="text"
                value={localRoom}
                onChange={(e) => setLocalRoom(e.target.value)}
                className="w-full px-3 py-2 text-xs rounded-xl bg-slate-950 border border-cyan-900/40 text-cyan-300 font-mono"
              />
            </div>

            <div className="flex items-center justify-end space-x-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
              <button onClick={() => onSave(localRoom, localConfig)} className="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950">
                Save
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
